# Global mise configuration of this machine: this repository is linked to ~/.config/mise.
# One file for macOS and Linux: OS-specific entries carry an `os` key
# (unavailable package managers, apt on macOS or brew-cask on Linux, are skipped on their own).

[tools]
bitwarden = "latest"
claude = "latest"
docker-cli = "latest"
docker-compose = "latest"
gh = "latest"
"github:docker/buildx" = { version = "latest", bin = "docker-buildx" }
# On macOS, kitty comes from Homebrew (cask): the GitHub release only ships a .dmg there
"github:kovidgoyal/kitty" = { version = "latest", asset_pattern = "kitty-*-x86_64.txz", os = ["linux/x64"] }
herdr = "latest"
jq = "latest"
lazydocker = "latest"
node = "lts"
"github:iffse/pay-respects" = "latest"
pipx = "latest"
"pipx:yq" = "latest"
python = "latest"
ripgrep = "latest"

[dotfiles]
"~/.zshrc" = { source = "dotfiles/zshrc" }
# "kitty" menu entry pointing to the mise kitty (not the apt one)
"~/.local/share/applications/kitty.desktop" = { source = "dotfiles/kitty.desktop", mode = "template", variants = [{ os = "linux" }] }

# Docker engine on Linux, from the official Docker repository
[bootstrap.apt.sources.docker]
uris = "https://download.docker.com/linux/debian"
components = "stable"
key = "https://download.docker.com/linux/debian/gpg"
fingerprint = "9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88"

[bootstrap.packages]
"apt:zsh" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-ce" = "latest"
# xterm-kitty terminal description for commands run with sudo,
# which do not get the TERMINFO provided by the mise kitty
"apt:kitty-terminfo" = "latest"
# Docker engine on macOS (lightweight VM); the docker CLI still comes from mise
"brew:colima" = { os = "macos" }
"brew-cask:kitty" = { os = "macos" }
# bash 5 for the tasks once Homebrew is on the PATH; /bin/bash stays 3.2, which the tasks
# still support (a fresh machine runs them before ~/.zshrc puts Homebrew on the PATH)
"brew:bash" = { os = "macos" }

# Starts Colima at login (ignored outside macOS).
# Goes through sh to find colima under /opt/homebrew (Apple Silicon) as well as /usr/local (Intel).
[bootstrap.macos.launchd.agents.colima]
program = "/bin/sh"
args = ["-c", "colima start"]
run_at_load = true
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" }

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

[bootstrap.user]
login_shell = "zsh"

[bootstrap.services.mise-history]
builtin = "history-watch"

# Once [tools] are installed:
# - herdr plugins (Terminal Browser, Terminal Code)
# - global instructions for coding agents (dotfiles/agents/AGENTS.md), linked only for the
#   agents installed on this machine: [dotfiles] entries cannot depend on that
[bootstrap.hooks.post-tools]
description = "herdr plugins, coding agent instructions"
run = ["mise run -q g:herdr:plugins", "mise run -q g:agents:link"]

[settings.pypi]
uvx = false
