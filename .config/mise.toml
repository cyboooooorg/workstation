# Tools and tasks for working on this repository (lint, tests, git hooks).
# Loaded only inside the repository: the machine configuration is ../config.toml.
# Versions are pinned (Renovate updates them); check with `mise ls-remote <tool>`.
[tools]
actionlint = "1.7.12"
bats = "1.14.0"
cocogitto = "7.0.0"
editorconfig-checker = "4.0.2"
gitleaks = "8.30.1"
node = "24.22.3" # lint:renovate runs npx
prek = "0.5.10"
shellcheck = "0.11.0"
typos = "1.52.2"
zizmor = "1.32.0"

[env]
RENOVATE_VERSION = "44.235.2"

[tasks.setup]
description = "Install the git hooks"
run = "prek install"

[tasks.lint]
description = "Run every lint:* task"
depends = ["lint:*"]

[tasks.test]
description = "Run the tests (bats): Claude Code hook and settings task"
run = "bats tests/"

[tasks.check]
description = "Lint and test (CI entry point)"
depends = ["lint", "test"]

[tasks."lint:secrets"]
description = "Scan the git history for secrets"
run = "gitleaks git --no-banner --redact"

[tasks."lint:typos"]
description = "Spell-check the tree"
run = "typos"

[tasks."lint:editorconfig"]
description = "Check files against .editorconfig"
run = "editorconfig-checker"

[tasks."lint:shell"]
description = "Shellcheck the shell scripts"
run = "shellcheck install.sh $(git ls-files tasks claude/hooks tests)"

[tasks."lint:ci"]
description = "Lint the GitHub Actions workflows"
run = """
actionlint
zizmor --offline .github/workflows
"""

[tasks."lint:renovate"]
description = "Validate the Renovate config"
run = "npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator --strict"

# Called by the commit-msg hook only (needs the message file), never by lint or check.
[tasks."hook:commit-msg"]
description = "Check a commit message with cocogitto"
usage = 'arg "<file>"'
run = 'cog verify --file "$usage_file"'
