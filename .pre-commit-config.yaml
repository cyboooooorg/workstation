# Git hooks, installed by `mise run setup` (prek). Each local hook calls a mise task of
# .config/mise.toml: the commands live there only, and CI runs the same tasks.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: local
    hooks:
      - id: lint-secrets
        name: lint:secrets
        entry: mise run lint:secrets
        language: system
        pass_filenames: false
      - id: lint-typos
        name: lint:typos
        entry: mise run lint:typos
        language: system
        pass_filenames: false
      - id: lint-editorconfig
        name: lint:editorconfig
        entry: mise run lint:editorconfig
        language: system
        pass_filenames: false
      - id: lint-shell
        name: lint:shell
        entry: mise run lint:shell
        language: system
        pass_filenames: false
        files: ^(install\.sh|tasks/|claude/hooks/|tests/|\.shellcheckrc$)
      - id: lint-ci
        name: lint:ci
        entry: mise run lint:ci
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
      - id: lint-renovate
        name: lint:renovate
        entry: mise run lint:renovate
        language: system
        pass_filenames: false
        files: ^renovate\.json$
      - id: hook-commit-msg
        name: hook:commit-msg
        entry: mise run hook:commit-msg
        language: system
        pass_filenames: true
        stages: [commit-msg]
      - id: test
        name: test
        entry: mise run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
